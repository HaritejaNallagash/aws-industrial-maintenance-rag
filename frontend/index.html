<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maintenance Operations Assistant</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./runtime-config.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="Maintenance operations assistant">
        <header class="topbar">
          <div>
            <p class="eyebrow">Industrial Maintenance Intelligence</p>
            <h1>Maintenance Operations Assistant</h1>
          </div>
        </header>

        <section class="query-panel">
          <div class="question-row">
            <label for="questionInput">Question</label>
            <textarea id="questionInput" rows="4">What should a technician inspect when filler FILL-203 reports intermittent pressure loss?</textarea>
          </div>

          <div class="filters-row" aria-label="Search filters">
            <label>
              Equipment
              <input id="equipmentFilter" value="FILL-203" />
            </label>
            <label>
              Document type
              <select id="documentTypeFilter">
                <option value="">Any</option>
                <option value="troubleshooting_guide">Troubleshooting guide</option>
                <option value="incident_report">Incident report</option>
                <option value="preventive_maintenance">Preventive maintenance</option>
                <option value="spare_part_catalog">Spare part catalog</option>
                <option value="safety_procedure">Safety procedure</option>
                <option value="alarm_reference">Alarm reference</option>
              </select>
            </label>
            <label>
              Results
              <input id="topKInput" type="number" min="1" max="10" value="5" />
            </label>
            <button id="askButton" class="primary-button" type="button">Ask</button>
          </div>
        </section>

        <section class="answer-grid">
          <article class="answer-panel">
            <h2>Answer</h2>
            <pre id="answerOutput">Enter a question and click Ask.</pre>
          </article>
          <article class="citation-panel">
            <h2>Citations</h2>
            <div id="citationOutput" class="citation-list"></div>
          </article>
        </section>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
